name: balamandian
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.2
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/splash_logo.png
    - assets/onboarding/images/
    - assets/onboarding/icons/
    - assets/onboarding/illustrations/
    - assets/onboarding/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/onboarding/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/onboarding/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/onboarding/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/onboarding/fonts/Inter-Bold.ttf
          weight: 700
